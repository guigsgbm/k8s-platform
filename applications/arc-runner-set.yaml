apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-set
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false
  # Pruning could terminate jobs or orphan registrations. Remove the pool first,
  # then the controller, CRDs, Secrets, and namespaces through the quickstart procedure.
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.15.1
    helm:
      releaseName: lab-localstack
      valuesObject:
        githubConfigUrl: https://github.com/labs-guigsgbm
        githubConfigSecret: arc-github-token
        runnerScaleSetName: lab-localstack
        runnerGroup: Default
        minRunners: 0
        maxRunners: 2
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-controller-gha-rs-controller
        template:
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.338.2
                command:
                  - /home/runner/run.sh
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    memory: 2Gi
                env:
                  - name: AWS_ENDPOINT_URL
                    value: http://localstack.localstack.svc.cluster.local:4566
                  - name: AWS_DEFAULT_REGION
                    value: us-east-1
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: lab-aws-credentials
                        key: access-key-id
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: lab-aws-credentials
                        key: secret-access-key
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
