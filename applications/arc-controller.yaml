apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  # Pruning could terminate jobs or orphan registrations. Remove the pool first,
  # then the controller, CRDs, Secrets, and namespaces through the quickstart procedure.
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.15.1
    helm:
      releaseName: arc-controller
      valuesObject:
        flags:
          watchSingleNamespace: arc-runners
          logLevel: info
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
